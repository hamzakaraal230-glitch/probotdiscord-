<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProBot | Giriş</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #10121c;
    color: white;
    font-family: Arial, sans-serif;
}

.login {
    width: 90%;
    max-width: 420px;
    padding: 40px 25px;
    text-align: center;
    background: #1b1f30;
    border: 1px solid #30364d;
    border-radius: 18px;
}

h1 {
    color: #8295ff;
    font-size: 38px;
}

p {
    color: #b9bfd4;
    line-height: 1.6;
}

button {
    margin-top: 20px;
    padding: 15px 25px;
    border: 0;
    border-radius: 9px;
    background: #5865f2;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #4752c4;
}
</style>
</head>

<body>

<div class="login">
    <h1>ProBot</h1>
    <p>Discord sunucunu yönetmek için hesabınla giriş yap.</p>

    <button onclick="login()">
        Discord ile Giriş Yap
    </button>
</div>

<script>
function login() {
    // Gerçek Discord OAuth2 bağlantısı sonraki aşamada eklenecek.
    // Şimdilik panel taslağını görüntülemek için kullanılır.
    window.location.href = "panel.html";
}
</script>

</body>
</html>
